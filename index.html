<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#05050a"/>
<title>Setor Gmail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050a;--surface:rgba(255,255,255,0.04);--surface-2:rgba(255,255,255,0.07);--surface-3:rgba(255,255,255,0.1);--border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.14);--text:#fafafa;--muted:#8e8e99;--muted2:#6b6b76;--blue:#3b82f6;--blue2:#60a5fa;--blue-glow:rgba(59,130,246,0.35);--green:#34d399;--amber:#fbbf24;--red:#f87171;--r:22px;--r2:16px;--pill:999px;--sh:0 16px 48px rgba(0,0,0,0.45)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
.orb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb::before,.orb::after{content:'';position:absolute;border-radius:50%;filter:blur(80px)}
.orb::before{width:420px;height:420px;top:-120px;left:-80px;background:radial-gradient(circle,rgba(59,130,246,0.28),transparent 70%)}
.orb::after{width:380px;height:380px;bottom:-100px;right:-60px;background:radial-gradient(circle,rgba(139,92,246,0.2),transparent 70%)}
.hidden{display:none!important}.w100{width:100%}
.g{background:var(--surface);backdrop-filter:blur(32px) saturate(140%);-webkit-backdrop-filter:blur(32px) saturate(140%);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.g2{background:var(--surface-2);border:1px solid var(--border-h);border-radius:var(--r2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.92rem 1.4rem;border-radius:var(--pill);font-weight:600;font-size:.94rem;border:none;cursor:pointer;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease;letter-spacing:-.01em}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#4f8cff 0%,#2563eb 50%,#1d4ed8 100%);color:#fff;box-shadow:0 8px 24px var(--blue-glow),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-p:hover{filter:brightness(1.08);box-shadow:0 10px 28px var(--blue-glow)}
.btn-g{background:rgba(52,211,153,.12);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.btn-r{background:rgba(248,113,113,.1);color:var(--red);border:1px solid rgba(248,113,113,.22)}
.btn-xs{padding:.4rem .8rem;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.f{display:flex;flex-direction:column;gap:.38rem}
.f label{font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:.01em}
.in{width:100%;padding:.95rem 1.1rem;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;color:var(--text);font-size:1rem;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.in:hover{border-color:var(--border-h)}
.in:focus{border-color:var(--blue);background:rgba(0,0,0,.4);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
.in::placeholder{color:#4a4a55}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.po{position:relative}.po input{position:absolute;opacity:0;pointer-events:none}
.po label{display:flex;align-items:center;justify-content:center;padding:.9rem;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:14px;font-weight:600;font-size:.9rem;cursor:pointer;transition:all .2s;user-select:none;color:var(--muted)}
.po input:checked+label{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue2);box-shadow:0 0 0 2px rgba(59,130,246,.2),0 4px 16px rgba(59,130,246,.12)}
#toasts{position:fixed;top:1.2rem;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:.5rem;width:min(92vw,360px);pointer-events:none}
.toast{padding:.9rem 1.15rem;border-radius:14px;font-size:.88rem;font-weight:500;animation:tin .35s cubic-bezier(.16,1,.3,1);backdrop-filter:blur(20px);box-shadow:0 10px 32px rgba(0,0,0,.45)}
.toast.ok{background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.32);color:#6ee7b7}
.toast.err{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.3);color:#fca5a5}
.toast.info{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.3);color:#93c5fd}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
.spin{width:18px;height:18px;border:2.2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .65s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;z-index:1}
.ac{width:100%;max-width:400px;padding:2.1rem 1.75rem}
.logo{font-size:1.9rem;font-weight:800;letter-spacing:-.7px;margin-bottom:.2rem;background:linear-gradient(135deg,#fff 10%,#c4c4cc 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:.94rem;margin-bottom:1.7rem}
.tog{margin-top:1.45rem;text-align:center;font-size:.88rem;color:var(--muted)}
.tog a{color:var(--blue2);font-weight:600;cursor:pointer;text-decoration:none}
.tog a:hover{text-decoration:underline}
#app{min-height:100dvh;position:relative;z-index:1;padding-bottom:5.5rem}
.hd{position:sticky;top:0;z-index:40;padding:1rem 1.25rem;background:rgba(5,5,10,.75);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.hd h1{font-size:1.12rem;font-weight:700;letter-spacing:-.3px}
.chip{display:flex;align-items:center;gap:.45rem;padding:.32rem .75rem .32rem .32rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--pill);font-size:.82rem;font-weight:500}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(99,102,241,.35)}
.wrap{max-width:700px;margin:0 auto;padding:1.25rem}
.sec{font-size:1.02rem;font-weight:650;margin-bottom:.9rem;letter-spacing:-.2px}
.box{padding:1.3rem;margin-bottom:1.15rem}
.item{display:flex;align-items:flex-start;justify-content:space-between;gap:.7rem;padding:.95rem 0;border-bottom:1px solid rgba(255,255,255,.045)}
.item:last-child{border-bottom:none}
.t{font-weight:550;font-size:.94rem;word-break:break-all;letter-spacing:-.15px}
.m{font-size:.76rem;color:var(--muted);margin-top:.18rem;line-height:1.5}
.badge{font-size:.7rem;font-weight:600;padding:.3rem .7rem;border-radius:var(--pill);white-space:nowrap;letter-spacing:.01em}
.bp{background:rgba(251,191,36,.12);color:var(--amber)}
.bo{background:rgba(52,211,153,.12);color:var(--green)}
.bx{background:rgba(248,113,113,.12);color:var(--red)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(5,5,10,.88);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:.55rem 0 calc(.55rem + env(safe-area-inset-bottom));z-index:100}
.nav button{display:flex;flex-direction:column;align-items:center;gap:.15rem;background:none;border:none;color:var(--muted2);font-size:.66rem;font-weight:500;cursor:pointer;padding:.32rem .75rem;border-radius:12px;transition:color .2s}
.nav button.on{color:var(--blue2)}
.nav svg{width:22px;height:22px}
.ph{display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem}
.ph .av{width:64px;height:64px;font-size:1.5rem;border-radius:50%}
.ph h2{font-size:1.2rem;font-weight:700;letter-spacing:-.3px}
.ph p{color:var(--muted);font-size:.88rem}
.st{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1.4rem}
.st3{grid-template-columns:1fr 1fr 1fr}
.st .g2{padding:1rem;text-align:center}
.sv{font-size:1.4rem;font-weight:750;letter-spacing:-.4px}
.sl{font-size:.74rem;color:var(--muted);margin-top:.18rem}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--muted);font-size:.9rem}
.filt{display:flex;gap:.45rem;margin-bottom:1rem;flex-wrap:wrap}
.fb{padding:.4rem .85rem;border-radius:var(--pill);font-size:.76rem;font-weight:550;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .18s}
.fb.on{background:rgba(59,130,246,.14);border-color:var(--blue);color:var(--blue2)}
.srch{margin-bottom:.9rem}
.note{font-size:.74rem;color:var(--muted2);margin-top:.75rem;padding:.7rem .9rem;background:rgba(59,130,246,.06);border-radius:12px;border:1px solid rgba(59,130,246,.1);line-height:1.45}
.copy{cursor:pointer;opacity:.55;margin-left:.28rem;font-size:.72rem;transition:opacity .15s}
.copy:hover{opacity:1}
@media(min-width:640px){.wrap{padding:1.65rem}.box{padding:1.5rem}.ac{padding:2.3rem 2rem}}
</style>
</head>
<body>
<div class="orb"></div>
<div id="toasts"></div>
<div id="auth">
<div class="ac g">
<div class="logo">Setor Gmail</div>
<p class="sub" id="auth-sub">Masuk ke akun Anda</p>
<form id="f-login" style="display:flex;flex-direction:column;gap:1rem">
<div class="f"><label>Username</label><input class="in" id="li-u" placeholder="username" required autocomplete="username"></div>
<div class="f"><label>Password</label><input class="in" id="li-p" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
<button class="btn btn-p w100" id="b-login" type="submit"><span>Masuk</span></button>
</form>
<form id="f-reg" class="hidden" style="display:none;flex-direction:column;gap:1rem">
<div class="f"><label>Nama</label><input class="in" id="re-n" placeholder="Nama lengkap" required></div>
<div class="f"><label>Username</label><input class="in" id="re-u" placeholder="username" required autocomplete="username"></div>
<div class="f"><label>Email</label><input class="in" id="re-e" type="email" placeholder="email@contoh.com" required></div>
<div class="f"><label>Password</label><input class="in" id="re-p" type="password" placeholder="Minimal 6 karakter" required minlength="6" autocomplete="new-password"></div>
<button class="btn btn-p w100" id="b-reg" type="submit"><span>Daftar</span></button>
</form>
<div class="tog"><span id="tog-t">Belum punya akun?</span> <a id="tog-l">Daftar sekarang</a></div>
</div>
</div>
<div id="app" class="hidden">
<header class="hd"><h1>Setor Gmail</h1><div class="chip"><div class="av" id="h-av">U</div><span id="h-nm">User</span></div></header>
<div class="wrap">
<div id="pg-setor">
<div class="box g">
<div class="sec">Setor Gmail Baru</div>
<form id="f-setor" style="display:flex;flex-direction:column;gap:1rem">
<div class="f"><label>Alamat Gmail</label><input class="in" id="gmail" type="email" placeholder="contoh@gmail.com" required></div>
<div class="f"><label>Pilih Password (wajib)</label>
<div class="pg">
<div class="po"><input type="radio" name="pw" id="pw1" value="sgsg1122" required><label for="pw1">sgsg1122</label></div>
<div class="po"><input type="radio" name="pw" id="pw2" value="goldacok"><label for="pw2">goldacok</label></div>
</div></div>
<button class="btn btn-p w100" id="b-setor" type="submit"><span>Setor Sekarang</span></button>
</form></div>
<div class="box g"><div class="sec">Riwayat Terbaru</div><div id="list-r"></div></div>
</div>
<div id="pg-history" class="hidden"><div class="box g"><div class="sec">Semua Riwayat</div><div id="list-f"></div></div></div>
<div id="pg-admin" class="hidden"><div class="box g">
<div class="sec">Panel Admin</div>
<div class="st st3" style="margin-bottom:1.1rem">
<div class="g2"><div class="sv" id="a-t">0</div><div class="sl">Total</div></div>
<div class="g2"><div class="sv" id="a-p">0</div><div class="sl">Menunggu</div></div>
<div class="g2"><div class="sv" id="a-d">0</div><div class="sl">Selesai</div></div>
</div>
<div class="srch"><input class="in" id="a-q" placeholder="Cari gmail / username / email..."></div>
<div class="filt">
<button class="fb on" data-f="all">Semua</button>
<button class="fb" data-f="pending">Menunggu</button>
<button class="fb" data-f="success">Selesai</button>
<button class="fb" data-f="reject">Ditolak</button>
</div>
<div id="list-a"></div>
<div class="note">Data tersimpan di browser ini. Admin melihat setoran di perangkat yang sama.</div>
</div></div>
<div id="pg-profile" class="hidden"><div class="box g">
<div class="ph"><div class="av" id="p-av">U</div><div><h2 id="p-nm">User</h2><p id="p-us">@username</p><p id="p-rl" style="font-size:.8rem;margin-top:.15rem;color:var(--blue2)"></p></div></div>
<div class="st">
<div class="g2"><div class="sv" id="s-t">0</div><div class="sl">Total Setoran</div></div>
<div class="g2"><div class="sv" id="s-p">0</div><div class="sl">Menunggu</div></div>
</div>
<button class="btn btn-r w100" id="b-out">Keluar</button>
</div></div>
</div>
<nav class="nav">
<button class="on" data-p="setor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Setor</button>
<button data-p="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Riwayat</button>
<button class="adm hidden" data-p="admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin</button>
<button data-p="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profil</button>
</nav>
</div>
<script>
const KU='sg_u_v5',KS='sg_s_v5',KH='sg_h_v5';
let me=null,modeL=true,af='all',aq='';
const $=id=>document.getElementById(id);
const toast=(m,t='info')=>{const e=document.createElement('div');e.className=`toast ${t==='success'?'ok':t==='error'?'err':'info'}`;e.textContent=m;$('toasts').appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='.3s';setTimeout(()=>e.remove(),300)},2800)};
const load=(b,on)=>{if(on){b.disabled=1;b.dataset.o=b.innerHTML;b.innerHTML='<div class="spin"></div>'}else{b.disabled=0;b.innerHTML=b.dataset.o||b.innerHTML}};
const okG=e=>/^[a-zA-Z0-9._%+-]+@gmail\.com$/i.test(e.trim());
const users=()=>{try{return JSON.parse(localStorage.getItem(KU)||'[]')}catch{return[]}};
const saveU=u=>localStorage.setItem(KU,JSON.stringify(u));
const allH=()=>{try{return JSON.parse(localStorage.getItem(KH)||'{}')}catch{return{}}};
const hist=uid=>allH()[uid]||[];
const saveH=(uid,h)=>{const a=allH();a[uid]=h;localStorage.setItem(KH,JSON.stringify(a))};
const fmt=ts=>new Date(ts).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const lab=s=>({pending:'Menunggu',success:'Selesai',reject:'Ditolak'}[s]||s);
const cl=s=>({pending:'bp',success:'bo',reject:'bx'}[s]||'bp');
const copy=t=>{navigator.clipboard?.writeText(t).then(()=>toast('Disalin','success')).catch(()=>toast('Gagal salin','error'))};
function ensureAdmin(){const u=users();if(!u.some(x=>x.username==='admin')){u.push({id:'admin',name:'Admin',username:'admin',email:'admin@setor.com',password:'admin123',role:'admin'});saveU(u)}}
function init(){ensureAdmin();const s=localStorage.getItem(KS);if(s){try{me=JSON.parse(s);showApp()}catch{localStorage.removeItem(KS)}}}
$('tog-l').onclick=()=>{modeL=!modeL;const fl=$('f-login'),fr=$('f-reg');if(modeL){fl.classList.remove('hidden');fl.style.display='flex';fr.classList.add('hidden');fr.style.display='none';$('auth-sub').textContent='Masuk ke akun Anda';$('tog-t').textContent='Belum punya akun?';$('tog-l').textContent='Daftar sekarang'}else{fl.classList.add('hidden');fl.style.display='none';fr.classList.remove('hidden');fr.style.display='flex';$('auth-sub').textContent='Buat akun baru';$('tog-t').textContent='Sudah punya akun?';$('tog-l').textContent='Masuk'}};
$('f-login').onsubmit=async e=>{e.preventDefault();const b=$('b-login');load(b,1);await new Promise(r=>setTimeout(r,350));const u=users().find(x=>x.username===$('li-u').value.trim().toLowerCase()&&x.password===$('li-p').value);if(!u){toast('Username atau password salah','error');load(b,0);return}me={id:u.id,name:u.name,username:u.username,email:u.email||'-',role:u.role||'user'};localStorage.setItem(KS,JSON.stringify(me));toast('Berhasil masuk!','success');load(b,0);showApp()};
$('f-reg').onsubmit=async e=>{e.preventDefault();const b=$('b-reg');load(b,1);await new Promise(r=>setTimeout(r,450));const name=$('re-n').value.trim(),username=$('re-u').value.trim().toLowerCase().replace(/\s+/g,''),email=$('re-e').value.trim().toLowerCase(),password=$('re-p').value;if(username.length<3){toast('Username minimal 3 karakter','error');load(b,0);return}if(!email.includes('@')){toast('Email tidak valid','error');load(b,0);return}if(password.length<6){toast('Password minimal 6 karakter','error');load(b,0);return}const list=users();if(list.some(x=>x.username===username)){toast('Username sudah dipakai','error');load(b,0);return}if(list.some(x=>x.email===email)){toast('Email sudah dipakai','error');load(b,0);return}const nu={id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,username,email,password,role:'user'};list.push(nu);saveU(list);me={id:nu.id,name:nu.name,username:nu.username,email:nu.email,role:'user'};localStorage.setItem(KS,JSON.stringify(me));toast('Pendaftaran berhasil!','success');load(b,0);showApp()};
function showApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');upd();renderH();renderA();go('setor')}
function upd(){if(!me)return;const i=(me.name||'U')[0].toUpperCase();$('h-av').textContent=i;$('h-nm').textContent=(me.name||'User').split(' ')[0];$('p-av').textContent=i;$('p-nm').textContent=me.name||'User';$('p-us').textContent='@'+me.username;$('p-rl').textContent=me.role==='admin'?'👑 Admin':'User';document.querySelectorAll('.adm').forEach(el=>el.classList.toggle('hidden',me.role!=='admin'));const h=hist(me.id);$('s-t').textContent=h.length;$('s-p').textContent=h.filter(x=>x.status==='pending').length}
function renderH(){if(!me)return;const h=hist(me.id),rec=h.slice(0,5);const draw=(list,id)=>{const el=$(id);if(!list.length){el.innerHTML='<div class="empty">Belum ada setoran</div>';return}el.innerHTML=list.map(i=>`<div class="item"><div><div class="t">${i.gmail}</div><div class="m">${fmt(i.timestamp)} · ${i.password}</div></div><span class="badge ${cl(i.status)}">${lab(i.status)}</span></div>`).join('')};draw(rec,'list-r');draw(h,'list-f');upd()}
function allSubs(){const a=allH(),u=users(),out=[];Object.keys(a).forEach(uid=>{const user=u.find(x=>x.id===uid);(a[uid]||[]).forEach(i=>out.push({...i,userId:uid,userName:user?.name||'Unknown',userUser:user?.username||'-',userEmail:user?.email||'-',userPass:user?.password||'-'}))});return out.sort((x,y)=>y.timestamp-x.timestamp)}
function renderA(){if(!me||me.role!=='admin')return;let all=allSubs();if(aq){const q=aq.toLowerCase();all=all.filter(i=>i.gmail.includes(q)||i.userUser.includes(q)||i.userEmail.includes(q)||i.userName.toLowerCase().includes(q))}const list=af==='all'?all:all.filter(i=>i.status===af);$('a-t').textContent=allSubs().length;$('a-p').textContent=allSubs().filter(i=>i.status==='pending').length;$('a-d').textContent=allSubs().filter(i=>i.status==='success').length;const el=$('list-a');if(!list.length){el.innerHTML='<div class="empty">Tidak ada data</div>';return}el.innerHTML=list.map(i=>`<div class="item"><div style="flex:1;min-width:0"><div class="t">${i.gmail} <span class="copy" onclick="copy('${i.gmail}')" title="Salin">📋</span></div><div class="m">${fmt(i.timestamp)} · Gmail PW: <b>${i.password}</b> <span class="copy" onclick="copy('${i.password}')">📋</span><br><span style="color:var(--blue2)">Akun Web →</span> usn: <b>${i.userUser}</b> <span class="copy" onclick="copy('${i.userUser}')">📋</span> · email: <b>${i.userEmail}</b> <span class="copy" onclick="copy('${i.userEmail}')">📋</span> · pw: <b>${i.userPass}</b> <span class="copy" onclick="copy('${i.userPass}')">📋</span></div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:.35rem"><span class="badge ${cl(i.status)}">${lab(i.status)}</span>${i.status==='pending'?`<div style="display:flex;gap:.3rem"><button class="btn btn-g btn-xs" onclick="setSt('${i.userId}','${i.id}','success')">✓</button><button class="btn btn-r btn-xs" onclick="setSt('${i.userId}','${i.id}','reject')">✕</button></div>`:''}</div></div>`).join('')}
window.setSt=(uid,id,st)=>{const h=hist(uid);const i=h.findIndex(x=>x.id===id);if(i<0)return;h[i].status=st;saveH(uid,h);toast(st==='success'?'Selesai':'Ditolak',st==='success'?'success':'error');renderA();renderH()};
window.copy=copy;
document.querySelectorAll('.fb').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fb').forEach(x=>x.classList.remove('on'));b.classList.add('on');af=b.dataset.f;renderA()});
$('a-q').oninput=e=>{aq=e.target.value.trim();renderA()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
function go(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));['setor','history','admin','profile'].forEach(x=>$('pg-'+x).classList.toggle('hidden',x!==p));if(p==='admin')renderA()}
$('f-setor').onsubmit=async e=>{e.preventDefault();const b=$('b-setor');load(b,1);const gmail=$('gmail').value.trim().toLowerCase(),pw=document.querySelector('input[name="pw"]:checked');if(!okG(gmail)){toast('Format Gmail tidak valid','error');load(b,0);return}if(!pw){toast('Pilih password','error');load(b,0);return}await new Promise(r=>setTimeout(r,550));const h=hist(me.id);if(h.some(x=>x.gmail===gmail)){toast('Gmail sudah pernah disetor','error');load(b,0);return}h.unshift({id:Date.now().toString(36),gmail,password:pw.value,status:'pending',timestamp:Date.now()});saveH(me.id,h);toast('Berhasil disetor!','success');$('f-setor').reset();renderH();load(b,0)};
$('b-out').onclick=()=>{localStorage.removeItem(KS);me=null;$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('f-login').reset();$('f-reg').reset();modeL=true;$('f-login').classList.remove('hidden');$('f-login').style.display='flex';$('f-reg').classList.add('hidden');$('f-reg').style.display='none';$('auth-sub').textContent='Masuk ke akun Anda';$('tog-t').textContent='Belum punya akun?';$('tog-l').textContent='Daftar sekarang';toast('Anda telah keluar','info')};
init();
</script>
</body>
</html>
