<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SetorGmail — Masuk / Daftar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <!-- LOGO TOP -->
  <a href="index.html" class="auth-logo">
    <span class="logo-icon">SG</span>
    <span class="logo-text">SETORGMAIL</span>
  </a>

  <!-- AUTH CARD -->
  <div class="auth-card">
    <!-- Toggle -->
    <div class="auth-toggle">
      <button type="button" class="toggle-btn" data-mode="masuk" id="btn-masuk">Masuk</button>
      <button type="button" class="toggle-btn" data-mode="daftar" id="btn-daftar">Daftar</button>
    </div>

    <!-- MASUK FORM -->
    <div id="form-masuk" class="auth-form">
      <h1>Selamat datang kembali</h1>
      <p class="auth-sub">Masuk untuk melanjutkan ke dasbor Anda.</p>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="nama@contoh.com" required />
        </div>
        <div class="field">
          <label for="login-password">Kata sandi</label>
          <input type="password" id="login-password" placeholder="Minimal 6 karakter" minlength="6" required />
        </div>
        <div class="field-extra">
          <a href="#" class="link">Lupa kata sandi?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Masuk</button>
      </form>
    </div>

    <!-- DAFTAR FORM -->
    <div id="form-daftar" class="auth-form" hidden>
      <h1>Buat akun baru</h1>
      <p class="auth-sub">Isi data berikut untuk mulai menggunakan SETORGMAIL.</p>

      <form id="register-form">
        <div class="field">
          <label for="reg-name">Nama tampilan</label>
          <input type="text" id="reg-name" placeholder="Nama Anda" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" placeholder="nama@contoh.com" required />
        </div>
        <div class="field">
          <label for="reg-referral">Kode referral <span class="optional">(opsional)</span></label>
          <input type="text" id="reg-referral" placeholder="CONTOH: AB12CD34" />
        </div>
        <div class="field">
          <label for="reg-password">Kata sandi</label>
          <input type="password" id="reg-password" placeholder="Minimal 6 karakter" minlength="6" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Daftar sekarang</button>
      </form>
    </div>

    <p class="auth-note">
      Kami tidak pernah meminta kode OTP, kode pemulihan, atau kata sandi layanan lain.
    </p>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="script.js"></script>
</body>
</html>
